name: SENTINEL LAW Motion Engine

on:
  push:
    branches: [main]
    paths:
      - "renderer.py"
      - "worker.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/render.yml"
      - "sample-job.json"
      - "sample-story.json"
  pull_request:
    paths:
      - "renderer.py"
      - "worker.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/render.yml"
      - "sample-job.json"
      - "sample-story.json"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Renderer regression and MP4 smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout video engine
        uses: actions/checkout@v7

      - name: Install FFmpeg and Ukrainian-capable fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m py_compile renderer.py worker.py tests/test_renderer.py

      - name: Run renderer regression tests
        run: python -m unittest discover -s tests -v

  render:
    name: Render queued videos
    needs: tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout video engine
        uses: actions/checkout@v7

      - name: Install FFmpeg and Ukrainian-capable fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Render queued videos
        env:
          APP_SCRIPT_BRIDGE_URL: ${{ secrets.APP_SCRIPT_BRIDGE_URL }}
          VIDEO_BRIDGE_TOKEN: ${{ secrets.VIDEO_BRIDGE_TOKEN }}
          MAX_JOBS_PER_RUN: "1"
        run: python worker.py
